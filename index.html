<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>XPeriencia: La FP se juega</title>
<link rel="stylesheet" href="styles.css?v=5">
</head>
<body>

<!-- ============ PORTADA ============ -->
<div id="splashScreen">
  <div id="splashEmojis"></div>
  <div class="splash-content">
    <div id="introSeq"></div>
    <div class="splash-title hidden" id="splashTitle">XPeriencia</div>
    <div class="splash-sub hidden" id="splashSub">La FP se juega</div>
    <button class="splash-start hidden" id="splashStartBtn">▶ Empezar</button>
    <button class="splash-continue hidden" id="splashContinueBtn">Continuar partida guardada</button>
  </div>
</div>

<!-- ============ TRANSICIÓN "A JUGAR" ============ -->
<div id="playIntro"><div class="txt">¡A JUGAR!</div></div>

<!-- ============ APP ============ -->
<div id="app">
  <div class="title-chip">XPeriencia</div>

  <div id="flowScreen" class="flow-screen hidden"></div>

  <div id="gameArea" class="hidden" style="display:flex;flex-direction:column;height:100%;">
    <div id="teamsPanel"></div>
    <div id="stage">
      <div id="timerWrap"><span class="t-num">--</span><span id="timerWarnText"></span></div>
      <div id="timeUpBanner"></div>
      <div id="turnScreen"></div>
      <div id="stageContent"></div>
    </div>
    <div id="teacherControls"></div>
  </div>
</div>

<!-- Overlay: elegir/crear identidad -->
<div class="identity-overlay" id="identityOverlay">
  <div class="identity-modal">
    <h3>Elige la identidad del equipo</h3>
    <div class="sec-label">Elige rápido</div>
    <div class="identity-grid" id="identityGrid"></div>
    <div class="sec-label">O crea el vuestro</div>
    <div class="custom-form">
      <button class="emoji-cycle" id="emojiCycleBtn">📦</button>
      <div class="hint">Toca el símbolo para cambiarlo</div>
      <input type="text" id="customNombre" placeholder="Nombre del equipo" maxlength="20">
      <input type="text" id="customPortavoz" placeholder="Portavoz (opcional)" maxlength="24">
      <button class="big-cta" id="customAddBtn">➕ Añadir este equipo</button>
      <div id="customError"></div>
    </div>
    <button class="flow-back" id="identityCancel" style="margin-top:14px">Cancelar</button>
  </div>
</div>

<input type="file" id="contentFile" accept=".txt,.json" class="hidden">

<!-- Chivatini: aviso rápido (solo reacciones de juego) -->
<div id="chivaBanner">
  <div class="b-portrait emoji">🤖</div>
  <div class="b-txt"></div>
</div>

<!-- Chivatini: modal (victoria / recuperación) -->
<div id="chivaOverlay">
  <div class="chiva-modal-lg">
    <div class="chiva-head">
      <div class="chiva-portrait emoji" id="chivaPortrait">👽</div>
      <div class="chiva-name">Chivatini</div>
    </div>
    <div class="chiva-bubble" id="chivaBubble">
      <div class="chiva-txt" id="chivaTxt"></div>
      <div class="chiva-arrow" id="chivaArrow">▸</div>
    </div>
  </div>
</div>

<!-- Icono único: ayuda + contenido + finalizar + menú -->
<button class="help-btn" id="helpBtn" title="Menú">?</button>
<div class="help-panel" id="helpPanel">
  <div class="hp-actions" id="hpActions"></div>
  <div class="hp-divider">
    Creado por <strong style="color:#7FE0FF">Alberto Sánchez Cabanillas</strong><br>
    Docente de Comercio y Marketing<br>
    <a href="https://www.linkedin.com/in/albertosanchezcabanillas/" target="_blank">LinkedIn</a> ·
    <a href="https://creativecommons.org/licenses/by-nc/4.0/" target="_blank">CC BY-NC 4.0</a>
  </div>
</div>

<script src="motor.js?v=5"></script>
<script src="chivatini.js?v=5"></script>
<script src="ui-core.js?v=5"></script>
<script src="ui-equipos.js?v=5"></script>
<script src="ui-juego.js?v=5"></script>
</body>
</html>
