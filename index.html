<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Motor FP — Núcleo común</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="app">

  <div class="topbar">
    <div class="brand"><span class="tag">FP:</span> Motor educativo</div>
    <div class="nav-actions">
      <button class="nav-btn" id="contentBtn">📚 CONTENIDO</button>
      <input type="file" id="contentFile" accept=".txt,.json" class="hidden">
      <button class="nav-btn" id="endBtn">🏁 FINALIZAR / RESULTADOS</button>
    </div>
  </div>

  <div id="teamsPanel"></div>

  <div id="stage">
    <div id="timerWrap"><span>⏱</span><span class="t-num">--</span></div>
    <div id="timeUpBanner"></div>
    <div id="turnScreen"></div>
  </div>

  <div id="teacherControls"></div>

  <div id="chivatini">
    <div class="cv-icon">🤖</div>
    <div class="cv-text"></div>
  </div>

  <footer class="attrib">Basado en la identidad "Formación Profesional · Aprendemos haciendo" — Alberto Sánchez Cabanillas · CC BY-NC 4.0</footer>
</div>

<script src="js/motor.js"></script>
<script src="js/chivatini.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
